<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Startup Validator - Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    animation: {
                        'blob': 'blob 7s infinite',
                    },
                    keyframes: {
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #020617;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-field {
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #f1f5f9;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .input-field:focus {
            background: rgba(0, 0, 0, 0.4);
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.1);
            outline: none;
        }

        /* Removing default styling for select on WebKit to allow custom styles */
        select.input-field {
            appearance: none;
            background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%239ca3af' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='M6 8l4 4 4-4'/%3e%3c/svg%3e");
            background-position: right 0.5rem center;
            background-repeat: no-repeat;
            background-size: 1.5em 1.5em;
            padding-right: 2.5rem;
        }

        .tab-btn {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .tab-active {
            background: linear-gradient(135deg, #6366f1, #a855f7);
            color: white;
            border-color: transparent;
            box-shadow: 0 4px 20px rgba(139, 92, 246, 0.3);
        }

        .tab-inactive {
            background: transparent;
            color: #94a3b8;
            border: 1px solid transparent;
        }

        .tab-inactive:hover {
            color: white;
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .animation-delay-2000 {
            animation-delay: 2s;
        }

        .animation-delay-4000 {
            animation-delay: 4s;
        }

        .fade-enter {
            opacity: 0;
            transform: translateY(15px) scale(0.98);
        }

        .fade-enter-active {
            opacity: 1;
            transform: translateY(0) scale(1);
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>

<body
    class="bg-slate-950 min-h-screen flex items-center justify-center relative overflow-x-hidden text-slate-200 py-12 px-4 sm:px-6">

    <!-- Ambient Animated Background Effects -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div
            class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-purple-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob">
        </div>
        <div
            class="absolute top-[20%] right-[-10%] w-[50%] h-[50%] bg-indigo-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob animation-delay-2000">
        </div>
        <div
            class="absolute bottom-[-20%] left-[20%] w-[60%] h-[60%] bg-blue-600 rounded-full mix-blend-screen filter blur-[120px] opacity-20 animate-blob animation-delay-4000">
        </div>
        <!-- Grid overlay -->
        <div
            class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCI+CjxyZWN0IHdpZHRoPSI0MCIgaGVpZ2h0PSI0MCIgZmlsbD0ibm9uZSI+PC9yZWN0Pgo8Y2lyY2xlIGN4PSIyIiBjeT0iMiIgcj0iMSIgZmlsbD0icmdiYSgyNTUsMjU1LDI1NSwwLjA1KSI+PC9jaXJjbGU+Cjwvc3ZnPg==')] z-0">
        </div>
    </div>

    <!-- Main Container -->
    <div class="glass-panel p-8 sm:p-10 rounded-[2rem] w-full max-w-2xl relative z-10 transition-all duration-500">

        <!-- Header -->
        <div class="text-center mb-10">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-purple-500 mb-6 shadow-lg shadow-purple-500/30 rotate-3 hover:rotate-6 transition-transform">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <h2
                class="text-3xl sm:text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-300 via-indigo-300 to-purple-300 mb-3 tracking-tight">
                AI Startup Validator
            </h2>
            <p class="text-slate-400 text-sm sm:text-base font-light">Validate your next big idea with AI-driven market
                insights and financial modeling.</p>
        </div>

        <!-- Tab Controls -->
        <div class="flex p-1.5 space-x-2 bg-slate-900/60 rounded-xl mb-8 border border-white/5 shadow-inner">
            <button id="tabLogin" onclick="switchTab('login')"
                class="flex-1 py-3 text-sm font-semibold tracking-wide rounded-lg tab-active">Log In</button>
            <button id="tabRegister" onclick="switchTab('register')"
                class="flex-1 py-3 text-sm font-semibold tracking-wide rounded-lg tab-inactive">Create Account</button>
        </div>

        {% if error %}
        <div class="mb-4 p-3 rounded-lg bg-red-500/20 text-red-300 text-sm">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="mb-4 p-3 rounded-lg bg-green-500/20 text-green-300 text-sm">
            {{ success }}
        </div>

        <script>
            // Switch to login tab after success
            window.onload = function() {
                switchTab('login');
                alert("Account created successfully! Please login.");
            }
        </script>
        {% endif %}

        <!-- LOGIN FORM SECTION -->
        <form id="loginForm" method="POST" action="{% url 'login' %}">
           {% csrf_token %}
            <div class="space-y-1">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Email
                    Address</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                    </div>
                    <input type="email" name="email" placeholder="you@startup.ai"
                        class="w-full pl-11 pr-4 py-3.5 rounded-xl input-field placeholder-slate-600 focus:bg-slate-900/50">
                </div>
            </div>

            <div class="space-y-1">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Password</label>
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                        </svg>
                    </div>

                    <input type="password" name="password" placeholder="••••••••"
                        class="w-full pl-11 pr-4 py-3.5 rounded-xl input-field placeholder-slate-600 focus:bg-slate-900/50">
                </div>
            </div>

            <div class="flex items-center justify-between pt-2">
                <label class="flex items-center text-sm text-slate-400 cursor-pointer group">
                    <div
                        class="relative flex items-center justify-center w-5 h-5 mr-3 border border-slate-600 bg-slate-800 rounded group-hover:border-indigo-400 transition-colors">
                        <input type="checkbox" class="peer opacity-0 absolute inset-0 cursor-pointer">
                        <svg class="w-3 h-3 text-indigo-400 opacity-0 peer-checked:opacity-100 transition-opacity pointer-events-none"
                            fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" />
                        </svg>
                    </div>
                    Remember me
                </label>
                <a href="#" class="text-sm font-medium text-indigo-400 hover:text-indigo-300 transition-colors">Forgot
                    password?</a>
            </div>
            
                <button type="submit"
                    class="w-full mt-8 bg-gradient-to-r from-indigo-500 to-purple-600 text-white font-semibold py-4 rounded-xl hover:shadow-[0_0_25px_rgba(139,92,246,0.35)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 flex justify-center items-center gap-2 group">
                    Access Dashboard
                    <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor"
                        viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M14 5l7 7m0 0l-7 7m7-7H3">
                        </path>
                    </svg>
                </button>
            
        </form>

        <!-- REGISTER FORM SECTION -->
        <form id="registerForm" method="POST" action="{% url 'register' %}" class="space-y-6 hidden">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Full
                        Name</label>
                    <input type="text" name="full_name" placeholder="John Doe"
                        class="w-full p-3.5 rounded-xl input-field placeholder-slate-600 focus:bg-slate-900/50">
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Phone
                        Number</label>
                    <input type="tel"  name="phone" placeholder="+1 (555) 000-0000"
                        class="w-full p-3.5 rounded-xl input-field placeholder-slate-600 focus:bg-slate-900/50">
                </div>
            </div>

           <div class="space-y-1">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">
                    Email Address
                </label>
                <input type="email" name="email" placeholder="founder@startup.com"
                    class="w-full p-3.5 rounded-xl input-field placeholder-slate-600 focus:bg-slate-900/50">
            </div>

            <!-- Divider -->
            <div class="relative py-2">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white/5"></div>
                </div>
                <div class="relative flex justify-center">
                    <span
                        class="px-3 bg-transparent text-slate-500 text-xs font-medium uppercase tracking-wider mix-blend-screen"
                        style="background-color: #0d152a;">Startup Details</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Startup
                        Name</label>
                    <input type="text" placeholder="Nexus AI"
                        class="w-full p-3.5 rounded-xl input-field placeholder-slate-600 focus:bg-slate-900/50">
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Industry
                        Focus</label>
                    <div class="relative">
                        <select class="w-full p-3.5 rounded-xl input-field text-slate-300 focus:bg-slate-900/50">
                            <option value="" disabled selected class="bg-slate-900">Select Industry</option>
                            <option value="tech" class="bg-slate-900">Technology / SaaS</option>
                            <option value="health" class="bg-slate-900">Healthcare / MedTech</option>
                            <option value="finance" class="bg-slate-900">Finance / FinTech</option>
                            <option value="ecommerce" class="bg-slate-900">E-commerce / Retail</option>
                            <option value="other" class="bg-slate-900">Other</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="space-y-1">
                <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Describe Your
                    Idea</label>
                <textarea placeholder="We are building an AI agent that automates..." rows="3"
                    class="w-full p-3.5 rounded-xl input-field placeholder-slate-600 resize-none focus:bg-slate-900/50"></textarea>
            </div>

            <!-- Divider -->
            <div class="relative py-2">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-white/5"></div>
                </div>
                <div class="relative flex justify-center">
                    <span
                        class="px-3 bg-transparent text-slate-500 text-xs font-medium uppercase tracking-wider mix-blend-screen"
                        style="background-color: #0d152a;">Security</span>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Create
                        Password</label>
                    <input type="password" name="password" placeholder="••••••••"
                        class="w-full p-3.5 rounded-xl input-field placeholder-slate-600 focus:bg-slate-900/50">
                </div>
                <div class="space-y-1">
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider ml-1">Confirm
                        Password</label>
                    <input type="password" name="confirm_password" placeholder="••••••••"
                        class="w-full p-3.5 rounded-xl input-field placeholder-slate-600 focus:bg-slate-900/50">
                </div>
            </div>

            <button type="submit"
                class="w-full mt-8 bg-gradient-to-r from-purple-500 to-pink-600 text-white font-semibold py-4 rounded-xl hover:shadow-[0_0_25px_rgba(217,70,239,0.35)] hover:scale-[1.02] active:scale-[0.98] transition-all duration-300 flex justify-center items-center gap-2 group">
                Create Account & Validate
                <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor"
                    viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </button>
        </form>

    </div>

    <!-- Scripts -->
    <script>
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const btnLogin = document.getElementById('tabLogin');
            const btnRegister = document.getElementById('tabRegister');

            if (tab === 'login') {
                // Hide Register
                registerForm.classList.add('hidden');
                registerForm.classList.remove('fade-enter', 'fade-enter-active');

                // Show Login
                loginForm.classList.remove('hidden');
                loginForm.classList.add('fade-enter');
                // Allow browser to render the initial state before applying active class for transition
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        loginForm.classList.add('fade-enter-active');
                    });
                });

                // Update Button Styles
                btnLogin.className = 'flex-1 py-3 text-sm font-semibold tracking-wide rounded-lg tab-active';
                btnRegister.className = 'flex-1 py-3 text-sm font-semibold tracking-wide rounded-lg tab-inactive';
            } else {
                // Hide Login
                loginForm.classList.add('hidden');
                loginForm.classList.remove('fade-enter', 'fade-enter-active');

                // Show Register
                registerForm.classList.remove('hidden');
                registerForm.classList.add('fade-enter');
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        registerForm.classList.add('fade-enter-active');
                    });
                });

                // Update Button Styles
                btnRegister.className = 'flex-1 py-3 text-sm font-semibold tracking-wide rounded-lg tab-active';
                btnLogin.className = 'flex-1 py-3 text-sm font-semibold tracking-wide rounded-lg tab-inactive';
            }
        }
    </script>
</body>

</html>
